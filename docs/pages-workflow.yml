name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rocket/package-lock.json
      - name: Install corda deps
        run: npm ci
      - name: Build corda
        run: npm run build
      - name: Install rocket deps
        run: npm ci
        working-directory: rocket
      - name: Build rocket
        run: npm run build
        working-directory: rocket
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/corda _site/rocket _site/corda-elastica
          cp docs/index.html _site/index.html
          cp dist/index.html _site/corda/index.html
          cp dist/index.html _site/corda-elastica/index.html
          cp rocket/dist/index.html _site/rocket/index.html
          touch _site/.nojekyll
          ls -lhR _site | tail -n 80
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
